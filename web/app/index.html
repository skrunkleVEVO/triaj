<header><a class="brand" href="../" aria-label="Triaj home"><img src="../assets/logo.svg" alt="" width="24" height="24"><span>Triaj</span></a><span class="hright"><span id="sync">Loading…</span><button id="acct" class="acct" aria-label="Account"></button></span></header>
<main id="view"><div class="boot"><img src="../assets/logo.svg" alt="" width="48" height="48"><div>Opening your planner…</div></div></main>
<nav aria-label="Sections">
<button data-click="go" data-args='["now"]' data-t="now"><svg class="ni" aria-hidden="true"><use href="#i-now"/></svg><span>Now</span></button>
<button data-click="go" data-args='["sched"]' data-t="sched"><svg class="ni" aria-hidden="true"><use href="#i-sched"/></svg><span>Schedule</span></button>
<button data-click="go" data-args='["tasks"]' data-t="tasks"><svg class="ni" aria-hidden="true"><use href="#i-tasks"/></svg><span>Tasks</span></button>
<button data-click="go" data-args='["focus"]' data-t="focus"><svg class="ni" aria-hidden="true"><use href="#i-focus"/></svg><span>Focus</span></button>
<button data-click="go" data-args='["files"]' data-t="files" class="hide-sm"><svg class="ni" aria-hidden="true"><use href="#i-files"/></svg><span>Files</span></button>
<button data-click="go" data-args='["ai"]' data-t="ai"><svg class="ni" aria-hidden="true"><use href="#i-ai"/></svg><span>AI</span></button>
