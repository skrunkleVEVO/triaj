<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triaj</title>
<meta name="description" content="Triaj: a student planner that syncs Canvas, plans your study time and keeps you focused.">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triaj">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icon-32.png" sizes="32x32">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><span class="brand"><img src="../assets/logo.svg" alt="" width="26" height="26">Triaj</span><span class="hright"><span id="sync">loading…</span><button id="acct" class="acct" aria-label="Account"></button></span></header>
<main id="view"><div class="boot"><img src="../assets/logo.svg" alt="" width="56" height="56"><div>Loading your planner…</div></div></main>
<nav>
<button data-click="go" data-args='["now"]' data-t="now"><i>🏠</i><span>Now</span></button>
<button data-click="go" data-args='["sched"]' data-t="sched"><i>🗓</i><span>Schedule</span></button>
<button data-click="go" data-args='["tasks"]' data-t="tasks"><i>✅</i><span>Tasks</span></button>
<button data-click="go" data-args='["focus"]' data-t="focus"><i>⏱</i><span>Focus</span></button>
<button data-click="go" data-args='["files"]' data-t="files"><i>📚</i><span>Files</span></button>
<button data-click="go" data-args='["ai"]' data-t="ai"><i>✨</i><span>AI</span></button>
<button data-click="go" data-args='["more"]' data-t="more"><i>⚙️</i><span>More</span></button>
</nav>
<div id="mini"></div>
<script type="module" src="boot.js"></script>
</body>
</html>
