<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to focus · Triaj</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="shared.css">
<style>
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;background-size:24px 24px}
.tag{position:relative;width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:36px 28px 26px}
.tag:before{content:"";position:absolute;top:-11px;left:50%;width:110px;height:22px;margin-left:-55px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--hlnow) 80%,transparent);border-radius:2px}
.site{font:600 14px var(--display);color:var(--mute);margin:0 0 6px}
h1{font-size:40px;line-height:1;font-weight:700;margin:0 0 14px}
.clock{font:700 64px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock span,.clock{text-decoration:none}
.on{font-size:15px;margin:8px 0 22px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .b{flex:1;min-width:150px;padding:11px}
.note{margin-top:14px}
</style></head>
<body>
<main class="tag" aria-live="polite">
  <p class="site" id="site"></p>
  <h1 id="head">This can wait until your break.</h1>
  <div class="clock" id="clock">--:--</div>
  <p class="on" id="on"></p>
  <div class="row"><button class="b" id="back">Back to work</button><button class="b mute" id="pass">Let me in for 5 minutes</button></div>
  <p class="s note">Blocking ends on its own when the focus round does. Change the list on Triaj's Focus page.</p>
</main>
<script src="blocked.js"></script>
</body></html>
